rollback_dev:
  stage: rollback
  resource_group: deploy_pipeline
  when: on_failure
  before_script: []
  script:
    - |
      echo "=== [stage: rollback] [job: rollback_dev] STARTED ==="

      urlencode() {
        printf '%s' "$1" | od -An -tx1 | tr ' ' '\n' | grep . | while read hex; do
          char=$(printf "\\x$hex")
          case "$char" in
            [a-zA-Z0-9._~-]) printf '%s' "$char" ;;
            *) printf '%%%s' "$hex" | tr 'a-f' 'A-F' ;;
          esac
        done
      }

      echo ">> Step 1/4: Configuring git identity..."
      git config user.email "$CI_BOT_EMAIL"
      git config user.name "$CI_BOT_NAME"
      echo ">> Step 1/4: Done."

      echo ">> Step 2/4: Setting authenticated remote URL..."
      ENCODED_USER=$(urlencode "$GITLAB_CI_BOT_USER")
      ENCODED_TOKEN=$(urlencode "$GITLAB_CI_BOT_TOKEN")
      REMOTE_URL="https://${ENCODED_USER}:${ENCODED_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git remote set-url origin "$REMOTE_URL"
      echo ">> Step 2/4: Done. (host=${CI_SERVER_HOST}, project=${CI_PROJECT_PATH}, user=${GITLAB_CI_BOT_USER}, token_length=${#GITLAB_CI_BOT_TOKEN})"

      echo ">> Step 3/4: Fetching ${GITLAB_MAIN_BRANCH}..."
      git fetch origin "$GITLAB_MAIN_BRANCH"
      echo ">> Step 3/4: Done."

      echo ">> Step 4/4: Force-pushing ${GITLAB_MAIN_BRANCH} to ${GITLAB_DEV_BRANCH}..."
      git push --force origin "${GITLAB_MAIN_BRANCH}:${GITLAB_DEV_BRANCH}"
      echo ">> Step 4/4: Done."

      echo "=== [stage: rollback] [job: rollback_dev] FINISHED ==="
      echo "${GITLAB_DEV_BRANCH} has been reset to ${GITLAB_MAIN_BRANCH}."
