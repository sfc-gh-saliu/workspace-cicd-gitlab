promote_to_main:
  stage: promote
  resource_group: deploy_pipeline
  retry:
    max: 2
    when: script_failure
  before_script: []
  script:
    - |
      echo "=== [stage: promote] [job: promote_to_main] STARTED ==="

      echo ">> Step 1/4: Configuring git identity..."
      git config user.email "$CI_BOT_EMAIL"
      git config user.name "$CI_BOT_NAME"
      echo ">> Step 1/4: Done."

      echo ">> Step 2/4: Setting authenticated remote URL..."
      REMOTE_URL="https://${GITLAB_CI_BOT_USER}:${GITLAB_CI_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git remote set-url origin "$REMOTE_URL"
      echo ">> Step 2/4: Done. (host=${CI_SERVER_HOST}, project=${CI_PROJECT_PATH}, user=${GITLAB_CI_BOT_USER}, token_length=${#GITLAB_CI_BOT_TOKEN})"

      echo ">> Step 3/4: Fetching branches..."
      git fetch origin "$GITLAB_DEV_BRANCH" "$GITLAB_MAIN_BRANCH"
      echo ">> Step 3/4: Done."

      echo ">> Step 4/4: Pushing ${GITLAB_DEV_BRANCH} to ${GITLAB_MAIN_BRANCH}..."
      git push origin "${GITLAB_DEV_BRANCH}:${GITLAB_MAIN_BRANCH}"
      echo ">> Step 4/4: Done."

      echo "=== [stage: promote] [job: promote_to_main] FINISHED ==="
      echo "${GITLAB_MAIN_BRANCH} has been fast-forwarded to ${GITLAB_DEV_BRANCH} (${CI_COMMIT_SHA})."
