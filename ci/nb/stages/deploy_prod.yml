nb_deploy_to_prod:
  extends: .configure-snowflake-cli
  stage: deploy_prod
  interruptible: true
  variables:
    GIT_STRATEGY: none
  needs:
    - nb_detect_and_resolve
    - nb_execute_in_dev
  script:
    - 'echo "=== [stage: deploy_prod] [job: nb_deploy_to_prod] STARTED ==="'
    - echo ">> Generating deployment manifest..."
    - python ci/nb/scripts/deploy.py > affected_projects.tsv
    - echo ">> Deploying to PROD..."
    - bash ci/nb/scripts/deploy.sh "$SNOWFLAKE_CONNECTION_PROD"
    - 'echo "=== [stage: deploy_prod] [job: nb_deploy_to_prod] FINISHED ==="'
