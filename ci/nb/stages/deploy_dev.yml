nb_deploy_to_dev:
  stage: deploy_dev
  interruptible: true
  variables:
    GIT_STRATEGY: none
  needs:
    - nb_detect_and_resolve
    - job: nb_validate
      artifacts: false
  before_script:
    - 'echo "=== [stage: deploy_dev] [job: nb_deploy_to_dev] STARTED ==="'
    - echo ">> Installing Snowflake CLI..."
    - pip install --upgrade snowflake-cli
    - snow --version
    - mkdir -p ~/.snowflake
    - printf '[connections.dev]\n[connections.prod]\n' > ~/.snowflake/config.toml
    - chmod 0600 ~/.snowflake/config.toml
    - echo ">> Snowflake CLI ready."
  script:
    - echo ">> Generating deployment manifest..."
    - python ci/nb/scripts/deploy.py > affected_projects.tsv
    - echo ">> Deploying to DEV..."
    - bash ci/nb/scripts/deploy.sh "$SNOWFLAKE_CONNECTION_DEV"
    - 'echo "=== [stage: deploy_dev] [job: nb_deploy_to_dev] FINISHED ==="'
