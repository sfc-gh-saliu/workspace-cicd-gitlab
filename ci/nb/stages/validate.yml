nb_validate:
  stage: validate
  interruptible: true
  variables:
    GIT_STRATEGY: none
  needs:
    - nb_detect_and_resolve
  script:
    - 'echo "=== [stage: validate] [job: nb_validate] STARTED ==="'
    - python ci/nb/scripts/validate.py
    - 'echo "=== [stage: validate] [job: nb_validate] FINISHED ==="'
